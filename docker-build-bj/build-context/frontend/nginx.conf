server {
    # 与 prd 前端容器内部监听端口保持一致（8091），只有宿主机 publish 端口不同，
    # 这样两个环境镜像内部配置完全一致，只靠 docker run -p 区分，不易混淆。
    listen 8091;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # UAT 后端容器在 family-manage-uat-net 网络内的名字是 family-manage-uat-backend，
        # 不能沿用 prd 的 family-manage-backend（两个栈在不同 docker 网络，各解析各的）。
        proxy_pass http://family-manage-uat-backend:12300/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
