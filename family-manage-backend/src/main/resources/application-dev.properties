# 生产/部署环境（与 dev 保持同一套服务地址时可同步修改）
n
# Druid 监控
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.reset-enable=true
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=admin

# 主库
spring.datasource.dynamic.datasource.master.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.dynamic.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:mysql://192.168.216.140:3306/family_manage?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong
spring.datasource.dynamic.datasource.master.username=root
spring.datasource.dynamic.datasource.master.password=admin123456

# MinIO（内网上传；图片通过 /api/files/view 代理访问，穿透无需单独映射 MinIO）
minio.endpoint=http://192.168.216.140:9000
minio.public-url=
minio.access-key=admin
minio.secret-key=admin123456
minio.bucket=family-manage

# 日志
logging.level.root=info
logging.level.com.example.familymanage=debug
