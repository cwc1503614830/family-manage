# 公共配置（与环境无关）
server.port=12300

spring.application.name=family-manage
# 默认激活 dev；IDEA 运行配置可覆盖为 prd，或启动参数：--spring.profiles.active=prd
spring.profiles.active=dev

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 动态数据源 - 公共连接池参数
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=false
spring.datasource.dynamic.druid.initial-size=10
spring.datasource.dynamic.druid.max-active=20
spring.datasource.dynamic.druid.min-idle=10
spring.datasource.dynamic.druid.max-wait=60000
spring.datasource.dynamic.druid.time-between-eviction-runs-millis=60000
spring.datasource.dynamic.druid.min-evictable-idle-time-millis=300000
spring.datasource.dynamic.druid.max-evictable-idle-time-millis=600000
spring.datasource.dynamic.druid.keep-alive=true
spring.datasource.dynamic.druid.validation-query=select 1 from dual
spring.datasource.dynamic.druid.test-on-borrow=false
spring.datasource.dynamic.druid.test-on-return=false
spring.datasource.dynamic.druid.test-while-idle=true
spring.datasource.dynamic.druid.filters=stat,wall,slf4j
spring.datasource.dynamic.druid.max-pool-prepared-statement-per-connection-size=-1
spring.datasource.dynamic.druid.connection-properties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
spring.datasource.dynamic.druid.use-global-data-source-stat=true

mybatis-plus.configuration.use-deprecated-executor=false
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.global-config.banner=false
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.familymanage.**.entity
