server:
  port: 12300

spring:
  application:
    name: family-manage
  # 使用 dynamic-datasource 时排除 Druid 单数据源自动配置，避免抢占了动态数据源
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    dynamic:
      primary: master
      strict: false
      druid:
        initial-size: 5
        max-active: 20
        min-idle: 5
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
        filters: stat,wall,slf4j
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.216.140:3306/cc_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: admin123456


mybatis-plus:
  configuration:
    use-deprecated-executor: false
    map-underscore-to-camel-case: false
  global-config:
    banner: false
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.familymanage.**.entity

logging:
  level:
    root: info
    com.example.familymanage: info
    com.baomidou.dynamic: debug
