server:
  port: 12300

spring:
  application:
    name: family-manage
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        resetEnable: true
        loginUsername: admin
        login-password: admin
    dynamic:
      primary: master
      strict: false
      druid:
        initial-size: 10
        max-active: 20
        min-idle: 10
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        minEvictableIdleTimeMillis: 300000
        maxEvictableIdleTimeMillis: 600000
        keep-alive: true
        validation-query: 'select 1 from dual'
        testOnBorrow: false
        testOnReturn: false
        testWhileIdle: true
        filters: stat,wall,slf4j
        maxPoolPreparedStatementPerConnectionSize: -1
        connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
        useGlobalDataSourceStat: true
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.216.140:3306/cc_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong
          username: root
          password: admin123456


mybatis-plus:
  configuration:
    use-deprecated-executor: false
    map-underscore-to-camel-case: false
  global-config:
    banner: false
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.familymanage.**.entity

minio:
  endpoint: http://192.168.216.140:9000
  public-url: http://192.168.216.140:9000
  access-key: admin
  secret-key: admin123456
  bucket: family-manage

logging:
  level:
    root: info
    com.example.familymanage: info
